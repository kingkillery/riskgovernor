[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "riskgovernor"
version = "0.1.0"
description = "Deterministic bankroll risk governance: hard gates, strategy rotation, loss-sized recovery."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "kingkillery" }]
keywords = ["risk", "bankroll", "drawdown", "position-sizing", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
riskgovernor = "riskgovernor.cli:main"

[tool.setuptools]
packages = ["riskgovernor"]

[tool.pytest.ini_options]
testpaths = ["tests"]